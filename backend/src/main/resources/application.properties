spring.application.name=biblioteca-backend
# Render (y otros hostings) asignan el puerto en la variable PORT; en local se usa 8080
server.port=${PORT:8080}

# ===== Credenciales locales (NO se suben al repositorio) =====
# Las contraseñas se leen de variables de entorno o del archivo
# backend/application-local.properties, que está en .gitignore.
# Copie application-local.properties.example, renómbrelo y complete sus datos.
spring.config.import=optional:file:./application-local.properties,optional:classpath:application-local.properties

# ===== Base de datos MySQL (perfil por defecto) =====
# La base "biblioteca" se crea sola si no existe.
# En local no hace falta tocar nada. En producción (TiDB Cloud) se define DB_PARAMS
# para activar SSL, por ejemplo:  sslMode=VERIFY_IDENTITY&serverTimezone=America/Lima
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:biblioteca}?${DB_PARAMS:createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones pequeño: alcanza para este sistema y respeta los límites
# de las bases de datos gratuitas y de un servidor con 512 MB de RAM
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=280000

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.time-zone=America/Lima

# ===== Seguridad JWT =====
# Clave en Base64 (mínimo 256 bits) tomada de la variable JWT_SECRET.
# Si no se define, se genera una clave aleatoria al iniciar (las sesiones
# se cierran cada vez que se reinicia el servidor).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=28800000
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# ===== Reglas de negocio =====
biblioteca.prestamo.dias=14
biblioteca.prestamo.max-activos=3
biblioteca.reserva.dias-retiro=3

# ===== Swagger =====
springdoc.swagger-ui.path=/swagger-ui.html
